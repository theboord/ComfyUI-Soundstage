<title>Soundstage App Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="The real Soundstage App for ComfyUI, running in the browser and replaying real GPU renders.">
<style>
  /* The page is the App: a slim bar (scene picker, What's new tour) over the real Soundstage widget, which fills the rest. */
  @font-face { font-family: "Space Grotesk"; font-weight: 400; font-display: swap; src: url("./extensions/soundstage/vendor/fonts/space-grotesk-400.woff2") format("woff2"); }
  @font-face { font-family: "Space Grotesk"; font-weight: 600; font-display: swap; src: url("./extensions/soundstage/vendor/fonts/space-grotesk-600.woff2") format("woff2"); }
  :root {
    --bg: #18151b; --panel: #211927; --panel2: #2a2330; --line: rgba(255,255,255,.09); --text: #f0efed; --muted: #a9a3ad; --accent: #F2FF59; --ink: #1a1420;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); height: 100%; }
  body { font: 14px/1.45 "Space Grotesk", ui-sans-serif, system-ui, sans-serif; display: flex; flex-direction: column; min-height: 100dvh; }
  .bar { flex: none; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .bar h1 { margin: 0; font-size: 16px; font-weight: 600; white-space: nowrap; }
  .bar h1 span { color: var(--accent); }
  .pill { font-size: 12px; color: var(--ink); background: var(--accent); border-radius: 999px; padding: 3px 10px; font-weight: 600; white-space: nowrap; }
  .pick { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .pick label { color: var(--muted); font-size: 12px; }
  #scene { font: inherit; font-size: 13px; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; max-width: min(64vw, 360px); }
  .bar button { font: inherit; font-size: 13px; font-weight: 600; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; cursor: pointer; min-height: 32px; }
  .bar button.hi { background: var(--accent); color: var(--ink); border-color: var(--accent); }
  .bar .sp { flex: 1; }
  #sceneNote { color: var(--muted); font-size: 12px; margin: 0; flex: 1 1 320px; min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #host { flex: 1 1 auto; min-height: 560px; height: calc(100dvh - 52px); padding-block: 0 max(8px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-width: 0; }
  #host > .ss-stage { height: 100% !important; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); max-width: min(92vw, 640px);
    background: var(--panel2); border: 1px solid var(--accent); color: var(--text); border-radius: 12px; padding: 10px 14px; font-size: 13px; z-index: 20050; }
  /* What's new: a card of tour stops, each opening the right scene and step. */
  #tour { position: fixed; z-index: 20040; right: max(12px, env(safe-area-inset-right, 0px)); top: 52px; width: min(380px, calc(100vw - 24px));
    max-height: calc(100dvh - 70px); overflow: auto; background: var(--panel2); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.55); padding: 12px; }
  #tour h2 { margin: 0 0 2px; font-size: 15px; }
  #tour .sub { color: var(--muted); font-size: 12px; margin: 0 0 8px; }
  #tour ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  #tour li { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--panel); }
  #tour li[aria-current="step"] { border-color: var(--accent); }
  #tour li b { display: block; font-size: 13px; }
  #tour li p { margin: 2px 0 6px; color: var(--muted); font-size: 12px; }
  #tour li .row { display: flex; gap: 6px; flex-wrap: wrap; }
  #tour li button { font: inherit; font-size: 12px; font-weight: 600; border-radius: 8px; padding: 4px 10px; cursor: pointer; border: 1px solid var(--line); background: var(--panel2); color: var(--text); min-height: 28px; }
  #tour li button.go { background: var(--accent); color: var(--ink); border-color: var(--accent); }
  #tour .x { position: absolute; top: 8px; right: 8px; }
  #tour .x button { font: inherit; background: transparent; border: 0; color: var(--muted); font-size: 18px; cursor: pointer; min-width: 32px; min-height: 32px; }
  #clip { border: 1px solid var(--line); border-radius: 14px; background: var(--panel2); color: var(--text); padding: 12px; width: min(960px, 94vw); }
  #clip::backdrop { background: rgba(0,0,0,.7); }
  #clip video, #clip img { width: 100%; max-height: 70dvh; border-radius: 8px; background: #000; display: block; }
  #clip .hd { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  #clip .hd b { font-size: 14px; }
  #clip .hd button { font: inherit; font-weight: 600; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 4px 12px; cursor: pointer; min-height: 32px; }
  #clip p { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
  @media (max-width: 720px) { #sceneNote { display: none; } .bar h1 .long { display: none; } #host { height: auto; min-height: 640px; } }
</style>
<div class="bar">
  <h1><span>Soundstage</span><span class="long"> &middot; ComfyUI App</span></h1>
  <span class="pill">Live demo &middot; replays real GPU renders</span>
  <div class="pick"><label for="scene">Scene</label><select id="scene" aria-label="Demo scene"></select></div>
  <button id="tourBtn" type="button" class="hi" aria-expanded="false" aria-controls="tour">What&rsquo;s new &middot; tour</button>
  <p id="sceneNote"></p>
</div>
<div id="host"></div>
<aside id="tour" hidden aria-label="What's new">
  <div class="x"><button type="button" id="tourClose" aria-label="Close the tour">&times;</button></div>
  <h2>What&rsquo;s new in Soundstage</h2>
  <p class="sub">Each stop opens the scene and step it lives on. &ldquo;Watch&rdquo; plays the real render or recording.</p>
  <ol id="tourList"></ol>
</aside>
<dialog id="clip" aria-labelledby="clipTitle">
  <div class="hd"><b id="clipTitle"></b><button type="button" id="clipClose">Close</button></div>
  <div id="clipBody"></div>
  <p id="clipNote"></p>
</dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="./demo.mjs"></script>
