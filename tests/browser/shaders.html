<!doctype html>
<html>
<head><meta charset="utf-8"><title>Soundstage shader check</title></head>
<body>
<!-- Compiles and renders the Depth pass shader (web/stage/depthshader.mjs, skinned, unskinned and cut-out) and the
     selection outline (web/stage/outline.mjs, hull + stencil mask, skinned) in a real WebGL context, and checks pixels:
     a posed skinned mesh's Depth silhouette must match its colour silhouette (it would stay in the bind pose if the
     skinning chunks were missing), and the outline must draw a ring outside the silhouette and nothing inside it.
     Run by tests/browser/run_shaders.mjs (headless Chromium); the result is written to the result block as JSON. -->
<pre id="result">pending</pre>
<script type="module">
import * as THREE from "../../web/vendor/three.module.min.mjs";
import { depthPassMaterial, depthCutout } from "../../web/stage/depthshader.mjs";
import { Highlighter } from "../../web/stage/outline.mjs";

const out = { ok: false, errors: [], checks: {} };
const W = 128, H = 128;
try {
  const canvas = document.createElement("canvas"); canvas.width = W; canvas.height = H;
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, stencil: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1); renderer.setSize(W, H, false);
  renderer.debug.checkShaderErrors = true;
  renderer.debug.onShaderError = (gl, program, vs, fs) => {
    out.errors.push(`shader error: ${gl.getProgramInfoLog(program)} | VS ${gl.getShaderInfoLog(vs)} | FS ${gl.getShaderInfoLog(fs)}`);
  };
  out.gl = renderer.getContext().getParameter(renderer.getContext().VERSION);
  const cam = new THREE.PerspectiveCamera(40, 1, 0.1, 50); cam.position.set(0, 1, 6); cam.lookAt(0, 1, 0); cam.updateMatrixWorld(true);

  // A two-bone column, bent 70 degrees at the middle bone: its posed shape is far from the bind pose.
  function skinned() {
    const geo = new THREE.BoxGeometry(0.4, 2, 0.4, 1, 8, 1); geo.translate(0, 1, 0);
    const pos = geo.attributes.position, n = pos.count, si = [], sw = [];
    for (let i = 0; i < n; i++) { const top = pos.getY(i) > 1.0 ? 1 : 0; si.push(top, 0, 0, 0); sw.push(1, 0, 0, 0); }
    geo.setAttribute("skinIndex", new THREE.Uint16BufferAttribute(si, 4));
    geo.setAttribute("skinWeight", new THREE.Float32BufferAttribute(sw, 4));
    const root = new THREE.Bone(), mid = new THREE.Bone(); mid.position.y = 1; root.add(mid);
    const mesh = new THREE.SkinnedMesh(geo, new THREE.MeshBasicMaterial({ color: 0xffffff }));
    mesh.add(root); mesh.bind(new THREE.Skeleton([root, mid]));
    mid.rotation.z = (70 * Math.PI) / 180;
    mesh.frustumCulled = false;
    return mesh;
  }
  function plain() {
    const m = new THREE.Mesh(new THREE.TorusKnotGeometry(0.6, 0.2, 64, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    m.position.y = 1; return m;
  }

  // a render target read back as a mask (any channel above a threshold)
  const rt = new THREE.WebGLRenderTarget(W, H, { stencilBuffer: true, depthBuffer: true });
  const buf = new Uint8Array(W * H * 4);
  function mask(scene, override = null) {
    scene.overrideMaterial = override;
    renderer.setRenderTarget(rt); renderer.setClearColor(0x000000, 1); renderer.clear(true, true, true);
    renderer.render(scene, cam);
    renderer.readRenderTargetPixels(rt, 0, 0, W, H, buf);
    renderer.setRenderTarget(null);
    scene.overrideMaterial = null;
    const m = new Uint8Array(W * H);
    for (let i = 0; i < W * H; i++) m[i] = Math.max(buf[4 * i], buf[4 * i + 1], buf[4 * i + 2]) > 8 ? 1 : 0;
    return m;
  }
  const iou = (a, b) => { let i = 0, u = 0; for (let k = 0; k < a.length; k++) { i += a[k] & b[k]; u += a[k] | b[k]; } return u ? i / u : 0; };
  const count = (a) => a.reduce((s, x) => s + x, 0);

  const depth = depthPassMaterial(0.1, 20);
  for (const [name, make] of [["skinned", skinned], ["unskinned", plain]]) {
    const scene = new THREE.Scene(); const mesh = make(); scene.add(mesh); scene.updateMatrixWorld(true);
    const colour = mask(scene), dep = mask(scene, depth);
    // the bind pose (what Depth drew before it skinned): the bent mesh's silhouette must differ from it
    let bindIou = null;
    if (mesh.isSkinnedMesh) {
      const z = mesh.skeleton.bones[1].rotation.z; mesh.skeleton.bones[1].rotation.z = 0; scene.updateMatrixWorld(true);
      const bind = mask(scene); mesh.skeleton.bones[1].rotation.z = z; scene.updateMatrixWorld(true);
      bindIou = +iou(bind, colour).toFixed(3);
    }
    out.checks[`depth_${name}`] = { colourPx: count(colour), depthPx: count(dep), iou: +iou(colour, dep).toFixed(3), bindVsPosedIou: bindIou };
  }

  // the cut-out Depth variant: a card whose map is transparent on its left half draws depth on the right half only
  {
    const data = new Uint8Array(4 * 4 * 4);
    for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) data.set([255, 255, 255, x < 2 ? 0 : 255], 4 * (y * 4 + x));
    const tex = new THREE.DataTexture(data, 4, 4); tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter; tex.needsUpdate = true;
    const card = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.MeshBasicMaterial({ map: tex, alphaTest: 0.5 }));
    card.position.y = 1;
    const scene = new THREE.Scene(); scene.add(card); scene.updateMatrixWorld(true);
    const colour = mask(scene);
    card.material = depthCutout(depth, card.material);
    const dep = mask(scene);
    out.checks.depth_cutout = { colourPx: count(colour), depthPx: count(dep), iou: +iou(colour, dep).toFixed(3) };
  }

  // the selection outline on the bent skinned mesh: a ring outside the silhouette, nothing over the object itself
  {
    const scene = new THREE.Scene(); const mesh = skinned(); const g = new THREE.Group(); g.add(mesh); scene.add(g); scene.updateMatrixWorld(true);
    const colour = mask(scene);
    const hl = new Highlighter({ actorMeshes: new Map([["a", g]]) });
    renderer.setRenderTarget(rt); renderer.setClearColor(0x000000, 1); renderer.clear(true, true, true);
    hl.render(renderer, cam, { selectedId: "a" });
    renderer.readRenderTargetPixels(rt, 0, 0, W, H, buf); renderer.setRenderTarget(null);
    const ring = new Uint8Array(W * H);
    for (let i = 0; i < W * H; i++) ring[i] = Math.max(buf[4 * i], buf[4 * i + 1], buf[4 * i + 2]) > 8 ? 1 : 0;
    let inside = 0, outside = 0, near = 0;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const k = y * W + x; if (!ring[k]) continue;
      if (colour[k]) { inside++; continue; }
      outside++;
      // within 4 px of the silhouette
      let hit = false;
      for (let dy = -4; dy <= 4 && !hit; dy++) for (let dx = -4; dx <= 4 && !hit; dx++) { const xx = x + dx, yy = y + dy; if (xx >= 0 && yy >= 0 && xx < W && yy < H && colour[yy * W + xx]) hit = true; }
      if (hit) near++;
    }
    out.checks.outline_skinned = { colourPx: count(colour), ringPx: outside, ringNearSilhouette: outside ? +(near / outside).toFixed(3) : 0, insidePx: inside };
  }
  out.ok = out.errors.length === 0;
} catch (e) {
  out.errors.push(String(e && e.stack || e));
}
document.getElementById("result").textContent = JSON.stringify(out);
document.title = "done";
</script>
</body>
</html>
