[project]
name = "comfyui-soundstage"
description = "A film set inside ComfyUI, run like a production: script breakdown, the Director's Book, ScriptSync's lined script, your phone as the viewfinder and a real timeline with Avid/Premiere/Resolve export. Block each shot in 3D with lifelike people, cars, horses, sets, real light and camera rigs; FLUX 3 Klein paints the first frame and LTX-2.5 animates it with sound, following your blocking. Plus per-object layers for AE/Nuke/Resolve/Blender, a scene agent and an audio department."
version = "0.1.0"
license = { file = "LICENSE" }
dependencies = ["soundfile>=0.12"]

[project.optional-dependencies]
aaf = ["pyaaf2>=1.7"]
sdk = ["comfy-sdk>=0.5", "comfy-api-proxy>=0.1.6"]

[project.urls]
Repository = "https://github.com/theboord/ComfyUI-Soundstage"

[tool.comfy]
PublisherId = ""
DisplayName = "Soundstage"
Icon = "docs/icon.svg"
includes = ["web", "docs", "example_workflows"]
