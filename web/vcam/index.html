<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<title>Soundstage VCam</title>
<style>
  :root {
    --bg: #0d0f12; --panel: #171a1f; --line: #2a2f37; --text: #e8eaed; --dim: #8b929c;
    --accent: #f0a032; --rec: #e5413a; --ok: #3fbf6f; --warn: #e8b54a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { min-height: 100vh; min-height: 100dvh; overscroll-behavior: none; touch-action: manipulation; }
  #overlay { max-width: 560px; margin: 0 auto; padding: max(12px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; }
  body.xr #overlay { background: transparent; }
  body.xr #viewfinder { opacity: 0.35; }
  header { display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 17px; margin: 0; letter-spacing: 0.02em; }
  header h1 span { color: var(--accent); }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); display: inline-block; margin-right: 5px; vertical-align: 1px; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--rec); } .dot.wait { background: var(--warn); }
  .spacer { flex: 1; }
  #notice { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 12px 14px; }
  #notice.warn { border-color: #6b4f1c; background: #221b10; }
  #notice b { display: block; margin-bottom: 4px; }
  #notice p { margin: 4px 0 0; color: var(--dim); font-size: 13px; }
  #viewfinder { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #050607; border: 1px solid var(--line); }
  #viewfinder canvas { width: 100%; height: 100%; display: block; }
  #timer { position: absolute; left: 10px; top: 8px; font: 600 14px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--dim); }
  #timer.rec { color: var(--rec); }
  #readout { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  #readout div { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-width: 0; }
  #readout small { display: block; color: var(--dim); font: 11px -apple-system, sans-serif; }
  .row { display: flex; align-items: center; gap: 12px; }
  #rec { width: 92px; height: 92px; border-radius: 50%; border: 4px solid var(--text); background: transparent; display: grid; place-items: center; cursor: pointer; flex: none; padding: 0; }
  #rec i { display: block; width: 66px; height: 66px; border-radius: 50%; background: var(--rec); transition: all 0.15s; }
  #rec.on i { width: 34px; height: 34px; border-radius: 6px; }
  #rec:disabled { opacity: 0.35; }
  #startbtns { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }
  button.btn { appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 10px; padding: 11px 12px; font: inherit; font-weight: 600; cursor: pointer; }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #1a1205; }
  button.btn:disabled { opacity: 0.4; }
  .controls { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
  .controls label { display: grid; grid-template-columns: 112px 1fr 48px; align-items: center; gap: 8px; font-size: 14px; }
  .controls output { text-align: right; color: var(--dim); font: 13px ui-monospace, monospace; }
  input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
  .toggle { display: flex !important; justify-content: space-between; }
  .toggle input { width: 22px; height: 22px; accent-color: var(--accent); }
  #sticks { display: none; justify-content: space-between; gap: 12px; }
  body.sticks #sticks { display: flex; }
  .stick { position: relative; width: 132px; height: 132px; border-radius: 50%; background: var(--panel); border: 1px solid var(--line); touch-action: none; flex: none; }
  .stick b { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: #3a404a; border: 1px solid #555d69; pointer-events: none; }
  .stick span { position: absolute; bottom: -20px; width: 100%; text-align: center; font-size: 11px; color: var(--dim); }
  #log { font-size: 13px; color: var(--dim); min-height: 1.3em; }
  #log b { color: var(--text); }
  #xrcanvas { position: fixed; inset: 0; width: 100%; height: 100%; display: none; }
</style>
</head>
<body>
<canvas id="xrcanvas"></canvas>
<div id="overlay">
  <header>
    <h1>Soundstage <span>VCam</span></h1>
    <span class="spacer"></span>
    <span class="badge" id="mode">no sensors</span>
    <span class="badge"><span class="dot wait" id="netdot"></span><span id="net">connecting</span></span>
  </header>

  <div id="notice"><b>Checking motion sensors…</b></div>

  <div id="viewfinder"><canvas id="vfcanvas"></canvas><div id="timer">00:00.0</div></div>

  <div id="readout">
    <div><small>X (m on set)</small><span id="px">–</span></div>
    <div><small>Y</small><span id="py">–</span></div>
    <div><small>Z</small><span id="pz">–</span></div>
    <div><small>Pan °</small><span id="ryaw">–</span></div>
    <div><small>Tilt °</small><span id="rpitch">–</span></div>
    <div><small>Roll °</small><span id="rroll">–</span></div>
  </div>

  <div class="row">
    <button id="rec" title="Record / Stop" disabled><i></i></button>
    <div id="startbtns"></div>
  </div>

  <div id="sticks">
    <div class="stick" id="stickMove"><b></b><span>move</span></div>
    <div class="stick" id="stickRise"><b></b><span>up / down · look (mouse)</span></div>
  </div>

  <div class="controls">
    <label>Strength <input type="range" id="strength" min="0" max="100" value="60"><output id="strengthOut">60</output></label>
    <label>Keep handheld <input type="range" id="keep" min="0" max="100" value="0"><output id="keepOut">0</output></label>
    <label>Scale ×<input type="range" id="scale" min="0" max="100" value="0"><output id="scaleOut">1</output></label>
    <label>Lens mm <input type="range" id="focal" min="0" max="100" value="31"><output id="focalOut">35</output></label>
    <label class="toggle">Horizon lock <input type="checkbox" id="horizon"></label>
    <label class="toggle">Use controller as camera <input type="checkbox" id="useController" checked></label>
  </div>

  <div id="log"></div>
</div>
<script type="module" src="./vcam/device.mjs"></script>
</body>
</html>
